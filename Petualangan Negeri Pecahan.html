/* ---------- Overlay, konfirmasi, toast ---------- */
function openOverlay(inner, cls = '') {
  const root = $('#overlay-root');
  root.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet ${cls}">${inner}</div></div>`;
  const first = $('button, input', root); if (first) setTimeout(() => first.focus({ preventScroll: true }), 30);
  return root;
}
function closeOverlay() { const r = $('#overlay-root'); if (r) r.innerHTML = ''; }
function confirmBox({ title, text, yes = 'Ya', no = 'Batal' }) {
  return new Promise(res => {
    openOverlay(`<h3 style="font-size:30px">${title}</h3><p>${text}</p>
      <div class="confirm"><button class="btn coral small" id="cf-yes">${yes}</button><button class="btn ghost small" id="cf-no">${no}</button></div>`, 'bad');
    $('#cf-yes').onclick = () => { closeOverlay(); res(true); };
    $('#cf-no').onclick = () => { closeOverlay(); res(false); };
  });
}
function toast(msg) {
  const t = h(`<div class="toast" role="status">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function confetti(n = 36) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#ffb000', '#ff6b6b', '#2fc476', '#3b8cff', '#7b5cff', '#ff8fb8'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = pick(colors);
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = 1.2 + Math.random() * 1.2 + 's';
    c.style.borderRadius = Math.random() < 0.4 ? '50%' : '3px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3200);
  }
}
/* ============================================================
   Mesin permainan: render soal, periksa jawaban, umpan balik
   ============================================================ */
const G = PNP.G = { level: 0, qs: [], i: 0, score: 0, correct: 0, results: [], streak: 0, bestStreak: 0, locked: false, cur: {} };
const TYPE_LABEL = { mc: 'Pilihan ganda', fill: 'Isi jawaban', match: 'Cocokkan pasangan', order: 'Urutkan', shade: 'Arsir gambar' };
const PRAISE = ['Hebat sekali!', 'Tepat sekali!', 'Mantap, kamu pintar!', 'Luar biasa!', 'Keren, jawabanmu benar!', 'Yey, benar!'];
const ENCOURAGE = ['Hampir tepat!', 'Belum tepat, ayo kita pelajari!', 'Tidak apa-apa, belajar dari sini!', 'Ayo coba pahami caranya!'];
const PAIR_COLORS = ['#3b8cff', '#ff8a3d', '#2fc476', '#7b5cff', '#ff6b9a'];

function startLevel(n) {
  G.level = n; G.qs = LEVELS[n - 1].make(); G.i = 0; G.score = 0; G.correct = 0;
  G.results = []; G.streak = 0; G.bestStreak = 0; G.locked = false; G.cur = {};
  go('play');
}

SCREENS.play = () => {
  const L = LEVELS[G.level - 1];
  return `<div class="hud">
      <button class="round-btn" data-act="show-lesson" aria-label="Buka materi" title="Materi">${ICON.bulb}</button>
      <div class="hud-mid"><div class="hud-title">Level ${L.id} · ${L.title}</div><div class="qdots" id="qdots"></div></div>
      <div class="hud-right">
        <span class="pill score-pill" id="score-pill">${ICON.star.replace('<svg', '<svg class="ico"')} Skor <b id="score-n">${G.score}</b></span>
        <button class="round-btn" data-act="restart-level" aria-label="Ulangi level dari awal" title="Ulangi level">${ICON.replay}</button>
      </div>
    </div>
    <div class="card qcard" id="qcard"></div>`;
};
SCREENS_AFTER.play = () => renderQuestion();

function renderQdots() {
  $('#qdots').innerHTML = G.qs.map((_, k) => {
    const r = G.results[k];
    return `<i class="${r === undefined ? (k === G.i ? 'now' : '') : r ? 'ok' : 'bad'}"></i>`;
  }).join('');
}

function renderQuestion() {
  const q = G.qs[G.i];
  G.locked = false;
  G.cur = {};
  renderQdots();
  $('#score-n').textContent = G.score;
  let body = '';
  const inline = q.type === 'fill' && q.prompt.includes('{{input}}');
  const prompt = q.prompt.replace('{{input}}', '<input class="num-in inline" id="in-int" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Jawaban">');

  if (q.type === 'mc') {
    body = `<div class="answers ${q.layout === 'row' ? 'row' : ''}">${q.options.map((o, k) => `<button class="opt" data-act="pick-opt" data-k="${k}">${o.html}</button>`).join('')}</div>`;
  } else if (q.type === 'fill') {
    if (q.kind === 'int') {
      body = inline ? '' : `<div class="fill-area"><input class="num-in" id="in-int" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Jawaban"><span class="unit-label">${q.unit || ''}</span></div>`;
    } else {
      body = `<div class="fill-area"><span class="frin-label">Tulis pecahannya:</span>
        <div class="frin"><input class="num-in" id="in-n" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Pembilang (atas)"><i class="bar"></i><input class="num-in" id="in-d" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Penyebut (bawah)"></div></div>`;
    }
  } else if (q.type === 'match') {
    G.cur.map = {}; G.cur.selL = null;
    G.cur.rightOrder = shuffle(q.pairs.map((_, k) => k));
    body = `<div class="match"><div class="match-col" id="mcL">${q.pairs.map((p, k) => `<button class="mitem" data-act="m-left" data-k="${k}">${p.l}</button>`).join('')}</div>
      <div class="match-col" id="mcR">${G.cur.rightOrder.map((k, pos) => `<button class="mitem" data-act="m-right" data-pos="${pos}">${q.pairs[k].r}</button>`).join('')}</div></div>
      <p class="shade-note">Ketuk satu kartu di kiri, lalu pasangannya di kanan. Ketuk lagi untuk membatalkan.</p>`;
  } else if (q.type === 'order') {
    G.cur.seq = [];
    body = `<div class="order-zone"><div class="order-tray" id="tray"></div><div class="order-bank" id="bank"></div></div>`;
  } else if (q.type === 'shade') {
    body = `<div class="qvisual">${emptyVis(q.kind, q.d, { w: 250, interactive: true })}</div><p class="shade-note" id="shade-note">Bagian berwarna: <b id="shade-n">0</b> dari ${q.d}</p>`;
  }

  $('#qcard').innerHTML = `
    <div class="qhead"><span>Soal ${G.i + 1} dari ${G.qs.length}</span><span class="qtype">${TYPE_LABEL[q.type]}</span></div>
    <div class="qprompt">${prompt}</div>
    ${q.visual ? `<div class="qvisual">${q.visual}</div>` : ''}
    ${body}
    <div class="q-actions">
      <button class="btn ghost small" data-act="reset-q">${ICON.replay.replace('<svg', '<svg style="width:22px;height:22px"')} Ulang soal</button>
      <button class="btn green" id="check-btn" data-act="check" disabled>${ICON.check} Periksa</button>
    </div>`;
  if (q.type === 'order') renderOrder();
  syncCheck();
  const first = $('#in-int') || $('#in-n');
  if (first && window.innerWidth > 700) first.focus({ preventScroll: true });
}

/* ---------- Status tombol Periksa ---------- */
function isReady() {
  const q = G.qs[G.i];
  if (q.type === 'mc') return G.cur.sel !== undefined;
  if (q.type === 'fill') {
    if (q.kind === 'int') return ($('#in-int') || {}).value !== '' && ($('#in-int') || {}).value !== undefined;
    return $('#in-n').value !== '' && $('#in-d').value !== '';
  }
  if (q.type === 'match') return Object.keys(G.cur.map).length === q.pairs.length;
  if (q.type === 'order') return G.cur.seq.length === q.items.length;
  if (q.type === 'shade') return $$('.vis .cell.on').length > 0;
  return false;
}
function syncCheck() { const b = $('#check-btn'); if (b) b.disabled = G.locked || !isReady(); }

/* ---------- Urutan ---------- */
function renderOrder() {
  const q = G.qs[G.i], seq = G.cur.seq;
  $('#tray').innerHTML = seq.length
    ? seq.map((id, pos) => `<button class="ocard placed" data-act="o-remove" data-id="${id}"><span class="tag">${pos + 1}</span>${q.items.find(x => x.id === id).html}</button>`).join('')
    : '<span class="hint">Ketuk pecahan di bawah, mulai dari yang terkecil.</span>';
  $('#bank').innerHTML = q.items.filter(it => !seq.includes(it.id)).map(it => `<button class="ocard" data-act="o-add" data-id="${it.id}">${it.html}</button>`).join('');
  syncCheck();
}

/* ---------- Periksa jawaban ---------- */
const parseNum = s => { const v = parseInt(String(s).trim(), 10); return Number.isFinite(v) ? v : NaN; };

function evaluate(q) {
  let ok = false, note = '';
  if (q.type === 'mc') {
    ok = G.cur.sel === q.answer;
    $$('.opt').forEach((el, k) => { el.disabled = true; if (k === q.answer) el.classList.add('right'); else if (k === G.cur.sel) el.classList.add('wrong'); });
  } else if (q.type === 'fill') {
    if (q.kind === 'int') {
      const el = $('#in-int'), v = parseNum(el.value);
      ok = v === q.answer; el.classList.add(ok ? 'ok' : 'bad'); el.disabled = true;
    } else {
      const nEl = $('#in-n'), dEl = $('#in-d'), n = parseNum(nEl.value), d = parseNum(dEl.value);
      if (Number.isFinite(n) && Number.isFinite(d) && d > 0) {
        const same = n === q.answer.n && d === q.answer.d;
        const equal = eq(F(n, d), q.answer);
        ok = q.exact ? same : equal;
        if (!ok && equal) note = 'Nilainya sudah sama, tetapi bentuknya belum seperti yang diminta soal.';
        if (ok && !q.exact && !same && simp(F(n, d)).d !== d) note = `Bisa disederhanakan menjadi ${frF(simp(F(n, d)))}.`;
        if (ok && !q.exact && !same && simp(F(n, d)).d === d) note = '';
      }
      [nEl, dEl].forEach(e => { e.classList.add(ok ? 'ok' : 'bad'); e.disabled = true; });
    }
  } else if (q.type === 'match') {
    ok = true;
    $$('#mcL .mitem').forEach((el, k) => {
      const pos = G.cur.map[k], right = G.cur.rightOrder[pos] === k;
      if (!right) ok = false;
      el.classList.add(right ? 'right' : 'wrong'); el.disabled = true;
    });
    $$('#mcR .mitem').forEach(el => { el.disabled = true; });
  } else if (q.type === 'order') {
    ok = G.cur.seq.every((id, k) => id === q.correctOrder[k]);
    $$('#tray .ocard').forEach((el, k) => { el.classList.add(G.cur.seq[k] === q.correctOrder[k] ? 'right' : 'wrong'); el.disabled = true; });
  } else if (q.type === 'shade') {
    const on = $$('.vis .cell.on').length;
    ok = on === q.n;
    $$('.vis .cell').forEach(c => c.style.pointerEvents = 'none');
    if (!ok) note = `Kamu mewarnai ${on} bagian, padahal seharusnya ${q.n} bagian.`;
  }
  return { ok, note };
}

function correctAnswerHtml(q) {
  if (q.type === 'mc') return `<span class="fb-ans">${q.options[q.answer].html}</span>`;
  if (q.type === 'fill') return `<span class="fb-ans">${q.kind === 'int' ? `<b class="whole">${q.answer}</b> ${q.unit || ''}` : frF(q.answer)}</span>`;
  if (q.type === 'order') return `<span class="fb-ans">${q.correctOrder.map(id => q.items.find(x => x.id === id).html).join(' ' + op('&lt;') + ' ')}</span>`;
  if (q.type === 'shade') return `<span class="fb-ans">${fr(q.n, q.d)} = ${q.n} bagian berwarna dari ${q.d} bagian</span>`;
  if (q.type === 'match') return `<div style="display:grid;gap:6px;margin-top:6px">${q.pairs.map(p => `<div style="display:flex;align-items:center;gap:10px"><span class="fb-ans" style="margin:0;transform:scale(.7);transform-origin:left center">${p.l}</span><b>=</b><span class="fb-ans" style="margin:0">${p.r}</span></div>`).join('')}</div>`;
  return '';
}

function checkAnswer() {
  if (G.locked) return;
  const q = G.qs[G.i];
  if (!isReady()) return;
  G.locked = true; syncCheck();
  const { ok, note } = evaluate(q);
  G.results[G.i] = ok;
  Save.data.stats.answered++;
  if (ok) {
    G.score += 10; G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); Save.data.stats.correct++;
    const pill = $('#score-pill'); $('#score-n').textContent = G.score; pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
    Audio_.play('correct'); confetti(26);
  } else { G.streak = 0; Audio_.play('wrong'); }
  Save.data.stats.bestStreak = Math.max(Save.data.stats.bestStreak, G.bestStreak);
  Save.write();
  renderQdots();
  const last = G.i === G.qs.length - 1;
  const nextBtn = `<button class="btn ${ok ? 'green' : 'blue'}" data-act="next-q" id="next-btn">${last ? 'Lihat Hasil' : 'Soal Berikutnya'} ${ICON.play}</button>`;
  if (ok) {
    openOverlay(`<div class="fb-head">${mascot('cheer', 96)}<div><h3>${pick(PRAISE)}</h3><span class="plus">+10 poin · Skor ${G.score}</span></div></div>
      ${note ? `<div class="fb-box"><span class="label">Catatan Pipi</span>${note}</div>` : ''}
      ${G.streak >= 3 ? `<div class="fb-box"><span class="label">Beruntun!</span>${G.streak} jawaban benar berturut-turut.</div>` : ''}
      ${nextBtn}`, 'good');
  } else {
    openOverlay(`<div class="fb-head">${mascot('think', 92)}<div><h3>${pick(ENCOURAGE)}</h3><span class="sub">Tidak ada poin kali ini. Skor tetap ${G.score}.</span></div></div>
      <div class="fb-box"><span class="label">Jawaban yang benar</span>${correctAnswerHtml(q)}</div>
      <div class="fb-box"><span class="label">Cara mendapatkannya</span>${note ? note + '<br>' : ''}${q.explain}</div>
      ${nextBtn}`, 'bad');
  }
}

function nextQuestion() {
  closeOverlay();
  if (G.i < G.qs.length - 1) { G.i++; renderQuestion(); window.scrollTo(0, 0); }
  else finishLevel();
}
/* ============================================================
   Akhir level, hasil, hadiah, penanganan klik, dan start
   ============================================================ */
function starsFor(correct, total) {
  const r = correct / total;
  return r >= 0.83 ? 3 : r >= 0.66 ? 2 : r >= 0.5 ? 1 : 0;
}

function finishLevel() {
  const n = G.level, total = G.qs.length, stars = starsFor(G.correct, total);
  const old = Save.levelInfo(n);
  const wasDone = old.stars >= 1, hadNext = n < 6 && Save.isUnlocked(n + 1);
  const coinsGain = stars >= 1 ? (wasDone ? 0 : 10) + Math.max(0, stars - old.stars) * 10 : 0;
  const better = G.score >= old.best;
  Save.data.levels[n] = {
    stars: Math.max(old.stars, stars), best: Math.max(old.best, G.score),
    correct: better ? G.correct : old.correct, total, plays: (old.plays || 0) + 1
  };
  Save.data.coins += coinsGain;
  const before = Save.data.badges.slice();
  BADGES.forEach(b => { if (!Save.data.badges.includes(b.id) && b.test()) Save.data.badges.push(b.id); });
  const gained = Save.data.badges.filter(id => !before.includes(id));
  Save.write();
  go('result', { n, total, stars, coinsGain, gained, newUnlock: n < 6 && stars >= 1 && !hadNext });
}

SCREENS.result = d => {
  const L = LEVELS[d.n - 1], pass = d.stars >= 1, allDone = Save.doneCount() === 6 && d.n === 6 && pass;
  const next = d.n < 6 && pass ? LEVELS[d.n] : null;
  const msg = d.stars === 3 ? 'Luar biasa! Hampir semua soal kamu jawab benar.' : d.stars === 2 ? 'Bagus sekali! Sedikit lagi bisa mendapat 3 bintang.' : d.stars === 1 ? 'Kamu lulus! Ulangi untuk mendapat bintang lebih banyak.' : `Belum lulus. Butuh minimal ${Math.ceil(d.total / 2)} jawaban benar. Baca materi lagi dan coba kembali!`;
  return `<div class="card result tint-${L.color}">
    ${mascot(pass ? 'cheer' : 'think', 130)}
    <h2>${pass ? 'Level ' + d.n + ' Selesai!' : 'Ayo Coba Lagi!'}</h2>
    <div class="big-stars" id="big-stars" role="img" aria-label="${d.stars} dari 3 bintang">${[0, 1, 2].map(i => starSvg(i < d.stars)).join('')}</div>
    <p>${msg}</p>
    <div class="stat-row">
      <div class="stat"><b>${G.score}/${d.total * 10}</b><span>Skor level ini</span></div>
      <div class="stat"><b>${G.correct}/${d.total}</b><span>Jawaban benar</span></div>
      <div class="stat"><b>+${d.coinsGain}</b><span>Koin baru${pass && d.coinsGain === 0 ? ' (naikkan bintang untuk koin)' : ''}</span></div>
      <div class="stat"><b>${Save.totalScore()}</b><span>Total skor terbaik</span></div>
    </div>
    ${d.newUnlock ? `<div class="fb-box" style="width:100%"><span class="label">Wilayah baru terbuka!</span>${next.region} · Level ${next.id}: ${next.title}</div>` : ''}
    ${d.gained.length ? `<div style="width:100%"><h3 style="font-size:24px;margin-bottom:8px">Medali baru</h3><div class="new-badges">${d.gained.map(id => badgeHtml(BADGES.find(b => b.id === id), true)).join('')}</div></div>` : ''}
    ${allDone ? `<div class="trophy-card"><div style="width:80px">${ICON.trophy}</div><h3>Pahlawan Negeri Pecahan!</h3><p>Kamu sudah menaklukkan semua 6 wilayah dengan ${Save.totalStars()} dari 18 bintang. Negeri Pecahan aman berkat kamu!</p></div>` : ''}
    <div class="action-row" style="justify-content:center">
      ${next ? `<button class="btn green" data-act="open-level" data-level="${next.id}">Level ${next.id} ${ICON.play}</button>` : ''}
      <button class="btn ${next ? 'blue' : 'green'}" data-act="retry">${ICON.replay.replace('<svg', '<svg style="width:26px;height:26px"')} Ulangi Level</button>
      ${pass ? '' : `<button class="btn grape" data-act="open-level" data-level="${d.n}">${ICON.book} Baca Materi</button>`}
      <button class="btn ghost" data-act="levels">${ICON.map} Peta Level</button>
      <button class="btn ghost" data-act="recap">${ICON.trophy} Rekap Nilai</button>
      <button class="btn ghost" data-act="menu">Menu Utama</button>
    </div>
  </div>`;
};
SCREENS_AFTER.result = d => {
  const svgs = $$('#big-stars svg');
  if (d.stars >= 1) Audio_.play('win'); else Audio_.play('wrong');
  svgs.forEach((s, i) => { if (i < d.stars) setTimeout(() => { s.classList.add('in'); Audio_.play('star'); }, 500 + i * 450); else s.style.opacity = '1', s.style.transform = 'none'; });
  if (d.stars >= 1) setTimeout(() => confetti(d.stars === 3 ? 70 : 40), 400);
  if (d.newUnlock) setTimeout(() => Audio_.play('unlock'), 500 + d.stars * 450);
};

/* ---------- Mencocokkan: gambar ulang status ---------- */
function renderMatch() {
  const L = $$('#mcL .mitem'), R = $$('#mcR .mitem');
  L.forEach(el => { el.removeAttribute('data-c'); el.classList.remove('pick'); el.style.removeProperty('--pc'); const t = $('.tag', el); if (t) t.remove(); });
  R.forEach(el => { el.removeAttribute('data-c'); el.style.removeProperty('--pc'); const t = $('.tag', el); if (t) t.remove(); });
  Object.entries(G.cur.map).forEach(([k, pos]) => {
    const color = PAIR_COLORS[k % PAIR_COLORS.length];
    [L[k], R[pos]].forEach(el => { el.dataset.c = k; el.style.setProperty('--pc', color); el.insertAdjacentHTML('beforeend', `<span class="tag">${+k + 1}</span>`); });
  });
  if (G.cur.selL !== null && G.cur.selL !== undefined) L[G.cur.selL].classList.add('pick');
  syncCheck();
}

/* ---------- Penanganan klik ---------- */
const ACTIONS = {
  start() { const n = nextLevelToPlay(); if (!Save.data.seenGuide) { Save.data.seenGuide = true; Save.write(); return go('guide'); } if (n) go('lesson', { level: n }); else go('levels'); },
  guide: () => go('guide'),
  levels: () => go('levels'),
  recap: () => go('recap'),
  menu: () => go('menu'),
  'open-level'(el) { go('lesson', { level: +el.dataset.level }); },
  'begin-level'(el) { startLevel(+el.dataset.level); },
  'lesson-prev': () => lessonStep(-1),
  'lesson-next': () => lessonStep(1),
  'show-lesson'() { lessonState.level = G.level; lessonState.i = 0; openOverlay(lessonHtml(LEVELS[G.level - 1], 0, true), 'lesson-modal'); $('#overlay-root .sheet').style.width = 'min(900px,100%)'; },
  'close-overlay': () => closeOverlay(),
  'pick-opt'(el) { if (G.locked) return; G.cur.sel = +el.dataset.k; $$('.opt').forEach(o => o.classList.remove('sel')); el.classList.add('sel'); syncCheck(); },
  'm-left'(el) {
    if (G.locked) return; const k = +el.dataset.k;
    if (G.cur.map[k] !== undefined) { delete G.cur.map[k]; G.cur.selL = null; }
    else G.cur.selL = G.cur.selL === k ? null : k;
    renderMatch();
  },
  'm-right'(el) {
    if (G.locked) return; const pos = +el.dataset.pos;
    const owner = Object.keys(G.cur.map).find(k => G.cur.map[k] === pos);
    if (owner !== undefined) { delete G.cur.map[owner]; }
    else if (G.cur.selL !== null && G.cur.selL !== undefined) { G.cur.map[G.cur.selL] = pos; G.cur.selL = null; }
    renderMatch();
  },
  'o-add'(el) { if (G.locked) return; G.cur.seq.push(+el.dataset.id); renderOrder(); },
  'o-remove'(el) { if (G.locked) return; G.cur.seq = G.cur.seq.filter(i => i !== +el.dataset.id); renderOrder(); },
  check: checkAnswer,
  'next-q': nextQuestion,
  'reset-q'() { if (!G.locked) renderQuestion(); },
  async 'restart-level'() { if (await confirmBox({ title: 'Ulangi level?', text: 'Soal akan diacak ulang dan skor level ini mulai dari nol.', yes: 'Ya, ulangi', no: 'Lanjut bermain' })) startLevel(G.level); },
  retry: () => startLevel(G.level),
  async quit() { if (await confirmBox({ title: 'Kembali ke menu?', text: 'Skor level yang sedang berjalan belum tersimpan.', yes: 'Ya, ke menu', no: 'Lanjut bermain' })) go('menu'); },
  'toggle-music'() { Save.data.settings.music = !Save.data.settings.music; Save.write(); Audio_.syncMusic(); renderToolbar(); },
  'toggle-sfx'() { Save.data.settings.sfx = !Save.data.settings.sfx; Save.write(); renderToolbar(); },
  async 'reset-ask'() {
    if (await confirmBox({ title: 'Hapus semua progres?', text: 'Semua bintang, skor, koin, dan medali akan dihapus. Tindakan ini tidak bisa dibatalkan.', yes: 'Ya, hapus', no: 'Batal' })) {
      const s = Save.data.settings; Save.reset(); Save.data.settings = s; Save.write(); go('recap'); toast('Progres dihapus. Mulai petualangan baru!');
    }
  }
};

document.addEventListener('click', e => {
  Audio_.unlock();
  const cell = e.target.closest('.vis-click .cell');
  if (cell && !G.locked && UI.current === 'play') { cell.classList.toggle('on'); $('#shade-n').textContent = $$('.vis .cell.on').length; Audio_.play('click'); syncCheck(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (!['check', 'toggle-sfx', 'pick-opt'].includes(act)) Audio_.play('click');
  else if (act === 'pick-opt') Audio_.play('click');
  if (ACTIONS[act]) ACTIONS[act](el);
});
document.addEventListener('keydown', e => {
  const cell = e.target.closest && e.target.closest('.vis-click .cell');
  if (cell && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); cell.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (e.key === 'Enter' && UI.current === 'play') {
    const nb = $('#next-btn');
    if (nb) { e.preventDefault(); nextQuestion(); return; }
    if (e.target.matches && e.target.matches('.num-in')) { e.preventDefault(); checkAnswer(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('.num-in')) { e.target.value = e.target.value.replace(/\D+/g, ''); syncCheck(); }
});

/* ---------- Mulai ---------- */
function boot() {
  Save.load();
  go('menu');
  const once = () => { Audio_.unlock(); window.removeEventListener('pointerdown', once); window.removeEventListener('keydown', once); };
  window.addEventListener('pointerdown', once);
  window.addEventListener('keydown', once);
}
Object.assign(PNP, { levels: LEVELS, save: Save, go, startLevel, F, eq, simp, val, ACTIONS, starsFor });
boot();
</script>
