<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Petualangan Negeri Pecahan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Konsep tata letak: peta petualangan bergaya buku cerita; satu layar = satu tugas.
   Game memakai satu tampilan cerah (sengaja tunggal, bukan tema gelap/terang). */
:root {
  color-scheme: light;
  --ink: #2a2750;
  --ink-soft: #5d5a8a;
  --paper: #ffffff;
  --sky-top: #b9e3ff;
  --sky-bot: #eaf8ff;
  --hill-a: #bdeccb;
  --hill-b: #9fe0b6;

  --sun: #ffb000;       --sun-deep: #d68500;
  --coral: #ff6b6b;     --coral-deep: #d24747;
  --grass: #2fc476;     --grass-deep: #1b9a58;
  --ocean: #3b8cff;     --ocean-deep: #2767c7;
  --grape: #7b5cff;     --grape-deep: #5a3fd1;

  --peach: #ffe1cf; --mint: #cff5df; --sky: #d3eaff; --lemon: #fff3b0; --lilac: #e5dcff; --pink: #ffd5e5;
  --line: #e4e1f5;

  --font-display: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  --radius: 22px;
  --shadow: 0 10px 0 rgba(42, 39, 80, .10), 0 18px 30px rgba(42, 39, 80, .10);
}
* { box-sizing: border-box; }
html, body { height: auto; }
body {
  margin: 0; background: var(--sky-bot); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; font-weight: 700; line-height: 1.45;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; border-radius: 12px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
b, strong { font-weight: 800; }

/* ---------- Latar langit ---------- */
.sky { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, #f4fff0 100%); overflow: hidden; }
.cloud { position: absolute; width: 150px; height: 46px; background: #fff; border-radius: 40px; opacity: .85; animation: drift 60s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 64px; height: 64px; left: 22px; top: -30px; }
.cloud::after { width: 48px; height: 48px; left: 74px; top: -20px; }
.cloud.c1 { top: 8%; left: -200px; animation-duration: 70s; }
.cloud.c2 { top: 24%; left: -200px; animation-duration: 95s; animation-delay: -40s; transform: scale(.7); }
.cloud.c3 { top: 14%; left: -200px; animation-duration: 120s; animation-delay: -80s; transform: scale(1.15); opacity: .7; }
@keyframes drift { to { transform: translateX(calc(100vw + 400px)) scale(var(--s, 1)); } }
.hills { position: absolute; left: 0; right: 0; bottom: 0; height: 26vh; min-height: 140px; }
.hills::before, .hills::after { content: ""; position: absolute; bottom: -40px; border-radius: 50% 50% 0 0; }
.hills::before { left: -10%; width: 70%; height: 100%; background: var(--hill-a); }
.hills::after { right: -12%; width: 70%; height: 82%; background: var(--hill-b); }

/* ---------- Kerangka aplikasi ---------- */
#app { max-width: 1040px; margin: 0 auto; padding-block: 14px 48px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 999px; padding: 6px 14px 6px 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 rgba(42, 39, 80, .10); min-height: 44px; }
.pill .ico { width: 30px; height: 30px; }
.round-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 5px 0 rgba(42, 39, 80, .14); display: grid; place-items: center; transition: transform .1s, box-shadow .1s; padding: 0; }
.round-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(42, 39, 80, .14); }
.round-btn svg { width: 26px; height: 26px; }
.round-btn.off { opacity: .55; }
.screen { animation: pop-in .35s ease both; }
@keyframes pop-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

/* ---------- Tombol besar ---------- */
.btn { --c: var(--sun); --cd: var(--sun-deep); --tc: #3a2500;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 10px 28px;
  border: 0; border-radius: 20px; background: var(--c); color: var(--tc); font-family: var(--font-display); font-weight: 800; font-size: 22px;
  box-shadow: 0 7px 0 var(--cd); transition: transform .1s, box-shadow .1s, filter .15s; text-decoration: none; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--cd); }
.btn[disabled] { filter: grayscale(.9) opacity(.55); cursor: not-allowed; transform: none; box-shadow: 0 7px 0 #9a98b8; }
.btn.green { --c: var(--grass); --cd: var(--grass-deep); --tc: #fff; }
.btn.blue { --c: var(--ocean); --cd: var(--ocean-deep); --tc: #fff; }
.btn.grape { --c: var(--grape); --cd: var(--grape-deep); --tc: #fff; }
.btn.coral { --c: var(--coral); --cd: var(--coral-deep); --tc: #fff; }
.btn.ghost { --c: #fff; --cd: #cfcbe8; --tc: var(--ink); }
.btn.small { min-height: 46px; font-size: 18px; padding: 6px 18px; border-radius: 16px; box-shadow: 0 5px 0 var(--cd); }
.btn.block { width: 100%; }
.btn svg { width: 28px; height: 28px; flex: none; }

/* ---------- Kartu ---------- */
.card { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.card.tint-peach { background: var(--peach); } .card.tint-mint { background: var(--mint); } .card.tint-sky { background: var(--sky); }
.card.tint-lemon { background: var(--lemon); } .card.tint-lilac { background: var(--lilac); } .card.tint-pink { background: var(--pink); }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-row h2 { font-size: clamp(28px, 5vw, 40px); }
.sub { color: var(--ink-soft); }

/* ---------- Pecahan bertumpuk ---------- */
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 .14em; font-family: var(--font-display); font-weight: 800; font-size: 1.12em; }
.fr > span:first-child { border-bottom: .11em solid currentColor; padding: 0 .22em .04em; min-width: 1.1em; text-align: center; }
.fr > span:last-child { padding-top: .04em; }
.op { margin: 0 .22em; font-family: var(--font-display); font-weight: 800; }
.whole { font-family: var(--font-display); font-size: 1.1em; }
.fr-big { font-size: 1.5em; margin: 10px 0; display: block; }
.symbig { font-family: var(--font-display); font-size: 1.7em; font-weight: 800; }

/* ---------- Ilustrasi ---------- */
.vis { display: block; margin: 0 auto; overflow: visible; }
.vis .ring { fill: none; stroke: var(--ink); stroke-width: 3; opacity: .85; }
.vis .cell .fillA { fill: var(--off); stroke: var(--line-c); stroke-width: 2; transition: fill .15s, transform .15s; }
.vis-pizza { --off: #fff6dc; --on: #ffb62e; --line-c: #e3a64a; }
.vis-cake { --off: #fff0f6; --on: #ff8fb8; --line-c: #e0568e; }
.vis-choc { --off: #f3e4d6; --on: #7a4a2b; --line-c: #bfa58b; }
.vis-bar { --off: #eaf6ff; --on: #3fa7ff; --line-c: #7cbcee; }
.vis-fruit { --off: #7ed957; --on: #ff5a5f; --line-c: rgba(0,0,0,.18); }
.vis .cell.on .fillA { fill: var(--on); }
.vis-pizza .cell .topping { fill: transparent; }
.vis-pizza .cell.on .topping { fill: #d8402f; stroke: #a82a1d; stroke-width: 1.5; }
.vis-pizza .cell:not(.on) .fillA { stroke-dasharray: 5 4; }
.vis-cake .cell .icing { fill: #fff; opacity: .9; } .vis-cake .cell .cherry { fill: transparent; }
.vis-cake .cell.on .cherry { fill: #e8344f; } .vis-cake .plate { fill: #d9d4f0; }
.vis-choc .cell .shine { fill: rgba(255,255,255,.18); } .vis-choc .cell:not(.on) .shine { fill: rgba(255,255,255,.55); }
.vis-fruit .stem { fill: none; stroke: #5b3a1e; stroke-width: 3; stroke-linecap: round; }
.vis-fruit .leaf { fill: #2e9e4d; } .vis-fruit .shine2 { fill: rgba(255,255,255,.6); }
.vis-click .cell { cursor: pointer; }
.vis-click .cell:hover .fillA { transform: scale(1.02); transform-box: fill-box; transform-origin: center; filter: brightness(1.05); }
.vis-click .cell:not(.on) .fillA { stroke-dasharray: 6 4; }
.stack-bars { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.sb-row { display: flex; align-items: center; gap: 14px; }
.sb-label { width: 56px; text-align: center; font-size: 20px; }
.eq-row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.eq-op { font-family: var(--font-display); font-size: 40px; font-weight: 800; }
.cmp-line { display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 32px; margin-top: 12px; }
.cmp-q { width: 54px; height: 54px; border-radius: 16px; background: var(--lemon); display: grid; place-items: center; font-family: var(--font-display); border: 3px dashed var(--sun-deep); }

/* ---------- Maskot ---------- */
.mascot { display: block; overflow: visible; }
.mascot .m-shadow { fill: rgba(42, 39, 80, .14); }
.mascot .m-body { fill: #4aa8ff; } .mascot .m-pack { fill: #ff8a3d; }
.mascot .m-face { fill: #ffd9b8; stroke: #e9b88c; stroke-width: 2; }
.mascot .m-cheek { fill: #ff9ab5; opacity: .7; }
.mascot .eye { fill: var(--ink); } .mascot .eyeline, .mascot .brow { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.mascot .mouth { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; }
.mascot .mouth.open { fill: #8a2840; stroke: var(--ink); stroke-linejoin: round; } .mascot .tongue { fill: none; stroke: #ff8aa0; stroke-width: 3; stroke-linecap: round; }
.mascot .m-hat { fill: #2fc476; } .mascot .m-brim { fill: #1b9a58; } .mascot .m-pom { fill: var(--sun); } .mascot .m-band { stroke: #fff3b0; stroke-width: 5; stroke-linecap: round; }
.mascot .m-pie-a { fill: #fff3b0; stroke: var(--ink); stroke-width: 2; } .mascot .m-pie-b { fill: var(--coral); stroke: var(--ink); stroke-width: 2; }
.mascot-cheer { animation: hop .7s ease-in-out infinite; }
.mascot-happy { animation: bob 2.4s ease-in-out infinite; }
@keyframes hop { 50% { transform: translateY(-14px) rotate(-3deg); } }
@keyframes bob { 50% { transform: translateY(-6px); } }

/* ---------- Menu utama ---------- */
.menu { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; align-items: center; padding-top: 8px; }
.menu-hero { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.kicker { display: inline-flex; align-self: flex-start; background: var(--paper); border-radius: 999px; padding: 6px 16px; font-family: var(--font-display); font-weight: 700; color: var(--grape-deep); box-shadow: 0 4px 0 rgba(42,39,80,.10); letter-spacing: .04em; }
.game-title { font-size: clamp(40px, 7.4vw, 84px); font-weight: 800; letter-spacing: -.01em; color: var(--ink); text-shadow: 0 5px 0 #fff, 0 9px 0 rgba(42,39,80,.12); }
.game-title .w2 { color: var(--coral); display: block; }
.game-title .w3 { color: var(--ocean); display: block; }
.menu-btns { display: grid; gap: 14px; max-width: 420px; }
.menu-stats { display: flex; gap: 10px; flex-wrap: wrap; }
.menu-art { position: relative; display: grid; place-items: center; min-height: 340px; }
.menu-art .blob { position: absolute; inset: 6% 4%; background: var(--lemon); border-radius: 46% 54% 52% 48% / 50% 44% 56% 50%; box-shadow: inset 0 -14px 0 rgba(255,176,0,.25); }
.menu-art .mascot-wrap { position: relative; z-index: 1; }
.float-vis { position: absolute; z-index: 2; filter: drop-shadow(0 6px 0 rgba(42,39,80,.12)); animation: bob 3.4s ease-in-out infinite; }
.float-vis.v1 { left: 2%; top: 4%; width: 120px; } .float-vis.v2 { right: 0; top: 14%; width: 112px; animation-delay: -1.2s; } .float-vis.v3 { right: 8%; bottom: 4%; width: 130px; animation-delay: -2s; }

/* ---------- Panduan ---------- */
.guide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 14px; }
.guide-step { display: flex; gap: 14px; align-items: flex-start; }
.guide-step .gnum { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; background: var(--sun); color: #3a2500; box-shadow: 0 4px 0 var(--sun-deep); }
.guide-step h3 { font-size: 22px; margin-bottom: 4px; }
.score-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.score-table td, .score-table th { padding: 10px 8px; text-align: left; border-bottom: 2px dashed var(--line); }
.score-table th { font-family: var(--font-display); }
.action-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 18px; }

/* ---------- Peta level ---------- */
.progress-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
.progress { height: 20px; background: rgba(255,255,255,.8); border-radius: 999px; overflow: hidden; box-shadow: inset 0 3px 0 rgba(42,39,80,.10); }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--grass), #7be3a6); border-radius: 999px; transition: width .6s ease; }
.map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 18px; margin-top: 8px; padding-bottom: 20px; }
.region { position: relative; text-align: left; border: 0; border-radius: 26px; padding: 16px 16px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 250px; box-shadow: 0 9px 0 rgba(42,39,80,.14), 0 18px 28px rgba(42,39,80,.10); transition: transform .12s, box-shadow .12s; background: var(--tint, var(--sky)); color: var(--ink); }
.region:nth-child(3n+2) { transform: translateY(18px); }
.region:not([disabled]):hover { transform: translateY(-4px); }
.region:nth-child(3n+2):not([disabled]):hover { transform: translateY(14px); }
.region[disabled] { cursor: not-allowed; filter: saturate(.35) brightness(1.02); }
.region .rnum { position: absolute; top: -14px; left: 14px; background: var(--ink); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 24px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 4px solid #fff; }
.region .rart { height: 92px; display: grid; place-items: center; }
.region h3 { font-size: 23px; }
.region .rreg { font-size: 15px; color: var(--ink-soft); }
.region .rtopic { font-size: 15px; color: var(--ink-soft); font-weight: 700; flex: 1; }
.stars { display: inline-flex; gap: 2px; } .stars svg { width: 30px; height: 30px; }
.star-off { fill: rgba(42,39,80,.15); } .star-on { fill: #ffc21a; stroke: #d68500; stroke-width: 1.5; stroke-linejoin: round; }
.lock { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.lock svg { width: 22px; height: 22px; }
.region .rstate { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; }
.region .go { background: #fff; border-radius: 999px; padding: 2px 12px; font-size: 16px; }
.region.current { outline: 5px solid var(--sun); outline-offset: 3px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { outline-color: #ffe08a; } }

/* ---------- Materi (lesson) ---------- */
.lesson { display: grid; gap: 14px; }
.lesson-card { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: center; min-height: 300px; }
.lesson-card h3 { font-size: clamp(26px, 4.4vw, 36px); margin-bottom: 10px; }
.lesson-text { font-size: 20px; }
.lesson-art { display: grid; place-items: center; gap: 10px; text-align: center; min-width: 0; }
.lesson-art:empty { display: none; }
.lesson-card.solo { grid-template-columns: 1fr; }
.lesson-card .mascot-side { display: grid; place-items: center; }
.cap { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.tips { margin: 8px 0 0; padding-left: 22px; display: grid; gap: 6px; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(42,39,80,.2); transition: all .2s; }
.dots i.on { background: var(--grape); width: 36px; border-radius: 8px; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---------- Bermain ---------- */
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.hud-mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hud-title { font-family: var(--font-display); font-weight: 800; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qdots { display: flex; gap: 6px; flex-wrap: wrap; }
.qdots i { flex: 1; min-width: 18px; max-width: 54px; height: 14px; border-radius: 8px; background: rgba(255,255,255,.85); box-shadow: inset 0 2px 0 rgba(42,39,80,.10); }
.qdots i.ok { background: var(--grass); } .qdots i.bad { background: var(--coral); } .qdots i.now { background: var(--sun); animation: pulse2 1s ease-in-out infinite; }
@keyframes pulse2 { 50% { transform: scaleY(1.5); } }
.hud-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.score-pill b { font-size: 24px; display: inline-block; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.score-pill.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18); background: var(--lemon); } }
.qcard { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-family: var(--font-display); font-weight: 700; }
.qtype { background: var(--lilac); color: var(--grape-deep); border-radius: 999px; padding: 2px 14px; font-size: 16px; }
.qprompt { font-size: clamp(21px, 3.2vw, 28px); line-height: 1.5; }
.qvisual { display: grid; place-items: center; padding: 8px 0; }
.qvisual:empty { display: none; }
.answers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.answers.row { grid-template-columns: repeat(3, 1fr); }
.opt { min-height: 84px; border: 4px solid var(--line); border-radius: 20px; background: #fff; font-size: 26px; display: grid; place-items: center; padding: 10px; transition: transform .1s, border-color .15s, background .15s; box-shadow: 0 5px 0 var(--line); }
.opt:hover { border-color: var(--ocean); }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.opt.sel { border-color: var(--ocean); background: #e6f1ff; box-shadow: 0 5px 0 var(--ocean); }
.opt.right { border-color: var(--grass); background: #dcf8e8; box-shadow: 0 5px 0 var(--grass); }
.opt.wrong { border-color: var(--coral); background: #ffe3e3; box-shadow: 0 5px 0 var(--coral); animation: shake .4s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.fill-area { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.num-in { width: 110px; height: 66px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 34px; border: 4px solid var(--line); border-radius: 18px; background: #fff; box-shadow: inset 0 4px 0 rgba(42,39,80,.06); }
.num-in:focus { border-color: var(--ocean); outline: none; box-shadow: 0 0 0 5px rgba(59,140,255,.25); }
.num-in.inline { width: 76px; height: 54px; font-size: 28px; vertical-align: middle; margin: 0 4px; }
.num-in.ok { border-color: var(--grass); background: #dcf8e8; } .num-in.bad { border-color: var(--coral); background: #ffe3e3; }
.frin { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
.frin .bar { width: 100%; height: 6px; background: var(--ink); border-radius: 4px; }
.frin-label { color: var(--ink-soft); font-size: 15px; }
.unit-label { font-family: var(--font-display); font-size: 22px; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 40px; }

<script>
/* ============================================================
   PETUALANGAN NEGERI PECAHAN — util: pecahan, acak, penyimpanan
   ============================================================ */
'use strict';

const PNP = window.PNP = {};

/* ---------- Matematika pecahan ---------- */
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const F = (n, d = 1) => ({ n, d });
const simp = f => { const g = gcd(f.n, f.d) || 1; return F(f.n / g, f.d / g); };
const eq = (a, b) => a.n * b.d === b.n * a.d;
const cmp = (a, b) => Math.sign(a.n * b.d - b.n * a.d);
const add = (a, b) => simp(F(a.n * b.d + b.n * a.d, a.d * b.d));
const sub = (a, b) => simp(F(a.n * b.d - b.n * a.d, a.d * b.d));
const mul = (a, b) => simp(F(a.n * b.n, a.d * b.d));
const div = (a, b) => simp(F(a.n * b.d, a.d * b.n));
const val = f => f.n / f.d;
const isWhole = f => f.n % f.d === 0;
const fkey = f => { const s = simp(f); return s.n + '/' + s.d; };

/* ---------- Tampilan pecahan (HTML) ---------- */
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const frF = f => (f.d === 1 ? `<b class="whole">${f.n}</b>` : fr(f.n, f.d));
const op = s => `<span class="op">${s}</span>`;

/* ---------- Acak ---------- */
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const sample = (arr, k) => shuffle(arr).slice(0, k);

/* ---------- Penyimpanan (LocalStorage, aman bila diblokir) ---------- */
const STORE_KEY = 'negeri-pecahan-v1';
let memoryStore = null;

const defaultSave = () => ({
  levels: {},          // {1:{stars,best,correct,total,plays}}
  coins: 0,
  badges: [],
  stats: { answered: 0, correct: 0, bestStreak: 0 },
  settings: { music: true, sfx: true },
  seenGuide: false
});

const Save = {
  data: null,
  load() {
    let raw = null;
    try { raw = window.localStorage.getItem(STORE_KEY); } catch (e) { raw = memoryStore; }
    let d = defaultSave();
    try {
      if (raw) {
        const p = JSON.parse(raw);
        d = Object.assign(d, p);
        d.settings = Object.assign(defaultSave().settings, p.settings || {});
        d.stats = Object.assign(defaultSave().stats, p.stats || {});
      }
    } catch (e) { d = defaultSave(); }
    this.data = d;
    return d;
  },
  write() {
    const raw = JSON.stringify(this.data);
    memoryStore = raw;
    try { window.localStorage.setItem(STORE_KEY, raw); } catch (e) { /* abaikan */ }
  },
  reset() {
    this.data = defaultSave();
    this.write();
  },
  levelInfo(n) { return this.data.levels[n] || { stars: 0, best: 0, correct: 0, total: 0, plays: 0 }; },
  isDone(n) { return this.levelInfo(n).stars >= 1; },
  isUnlocked(n) { return n === 1 || this.isDone(n - 1); },
  totalScore() { return Object.values(this.data.levels).reduce((s, l) => s + (l.best || 0), 0); },
  totalStars() { return Object.values(this.data.levels).reduce((s, l) => s + (l.stars || 0), 0); },
  doneCount() { return [1, 2, 3, 4, 5, 6].filter(n => this.isDone(n)).length; }
};

/* ---------- Helper DOM ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
/* ============================================================
   Audio: musik latar & efek suara (WebAudio, tanpa file luar)
   ============================================================ */
const Audio_ = PNP.audio = (() => {
  let ctx = null, master = null, musicGain = null, timer = null, step = 0, playing = false;

  const ensure = () => {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.0; musicGain.connect(master);
    } catch (e) { ctx = null; }
    return ctx;
  };

  const tone = (freq, t0, dur, type, vol, dest) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  };

  const N = { C4: 261.6, D4: 293.7, E4: 329.6, G4: 392, A4: 440, C5: 523.3, D5: 587.3, E5: 659.3, G5: 784, A5: 880, C6: 1046.5, F4: 349.2, B4: 493.9 };

  const sfx = {
    click() { tone(N.E5, ctx.currentTime, 0.08, 'triangle', 0.18); },
    correct() {
      const t = ctx.currentTime;
      [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone(f, t + i * 0.09, 0.25, 'triangle', 0.28));
    },
    wrong() {
      const t = ctx.currentTime;
      tone(220, t, 0.22, 'sawtooth', 0.14);
      tone(165, t + 0.18, 0.32, 'sawtooth', 0.14);
    },
    star() { const t = ctx.currentTime; [N.G5, N.C6].forEach((f, i) => tone(f, t + i * 0.12, 0.3, 'sine', 0.3)); },
    win() {
      const t = ctx.currentTime;
      [N.C5, N.E5, N.G5, N.C6, N.G5, N.C6].forEach((f, i) => tone(f, t + i * 0.12, 0.35, 'triangle', 0.28));
    },
    unlock() { const t = ctx.currentTime; [N.E5, N.A5].forEach((f, i) => tone(f, t + i * 0.1, 0.2, 'square', 0.1)); }
  };

  // Melodi riang (pentatonik C mayor), 8 ketukan x beberapa pola
  const melody = [
    N.C5, N.E5, N.G5, N.E5, N.A5, N.G5, N.E5, N.D5,
    N.C5, N.D5, N.E5, N.G5, N.E5, N.D5, N.C5, null,
    N.G4, N.C5, N.E5, N.C5, N.A4, N.C5, N.D5, N.E5,
    N.G5, N.E5, N.D5, N.C5, N.D5, N.E5, N.C5, null
  ];
  const bass = [N.C4, N.C4, N.A4 / 2, N.A4 / 2, N.F4 / 2, N.F4 / 2, N.G4 / 2, N.G4 / 2];

  const tick = () => {
    if (!ctx || !playing) return;
    const t = ctx.currentTime + 0.05;
    const note = melody[step % melody.length];
    if (note) tone(note, t, 0.28, 'triangle', 0.16, musicGain);
    if (step % 4 === 0) tone(bass[(step / 4 | 0) % bass.length], t, 0.55, 'sine', 0.2, musicGain);
    step++;
  };

  const startMusic = () => {
    if (!ensure() || playing) return;
    playing = true;
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.setTargetAtTime(0.5, ctx.currentTime, 0.2);
    timer = setInterval(tick, 260);
  };
  const stopMusic = () => {
    playing = false;
    clearInterval(timer);
    if (ctx) musicGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.1);
  };

  return {
    play(name) {
      if (!Save.data.settings.sfx) return;
      if (!ensure()) return;
      try { sfx[name](); } catch (e) { /* abaikan */ }
    },
    syncMusic() {
      if (Save.data.settings.music) startMusic(); else stopMusic();
    },
    // dipanggil setelah interaksi pertama (kebijakan autoplay browser)
    unlock() { ensure(); this.syncMusic(); },
    isPlaying: () => playing
  };
})();
/* ============================================================
   Ilustrasi pecahan (SVG): pizza, kue, cokelat, buah, batang
   Setiap sel punya data-i dan kelas .on bila berwarna (diarsir)
   ============================================================ */
const KIND_NAME = { pizza: 'pizza', cake: 'kue', choc: 'cokelat', fruit: 'buah', bar: 'pita' };

const PAL = {
  pizzaOn: '#ffb62e', pizzaOff: '#fff6dc', pizzaLine: '#d98a1c',
  cakeOn: '#ff8fb8', cakeOff: '#fff0f6', cakeLine: '#e0568e',
  chocOn: '#7a4a2b', chocOff: '#f3e4d6', chocLine: '#4e2c16',
  barOn: '#3fa7ff', barOff: '#eaf6ff', barLine: '#1f6fc2',
  appleOn: '#ff5a5f', appleOff: '#7ed957'
};

/* Faktor grid untuk cokelat */
const gridFor = d => {
  let best = [1, d];
  for (let r = 1; r * r <= d; r++) if (d % r === 0) best = [r, d / r];
  return best; // [baris, kolom]
};

/* flags: array boolean sepanjang d. opts: {w, interactive} */
function partsVis(kind, d, flags, opts = {}) {
  const w = opts.w || 220;
  const cls = 'vis vis-' + kind + (opts.interactive ? ' vis-click' : '');
  const cell = (i, inner) =>
    `<g class="cell${flags[i] ? ' on' : ''}" data-i="${i}" ${opts.interactive ? 'tabindex="0" role="button" aria-label="Bagian ' + (i + 1) + '"' : ''}>${inner}</g>`;
  let body = '', vb = '0 0 220 220';

  if (kind === 'pizza') {
    const cx = 110, cy = 110, r = 98;
    if (d === 1) {
      body = cell(0, `<circle cx="${cx}" cy="${cy}" r="${r}" class="fillA"/>`);
    } else {
      for (let i = 0; i < d; i++) {
        const a0 = -Math.PI / 2 + (2 * Math.PI * i) / d, a1 = -Math.PI / 2 + (2 * Math.PI * (i + 1)) / d;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const am = (a0 + a1) / 2, px = cx + r * 0.6 * Math.cos(am), py = cy + r * 0.6 * Math.sin(am);
        const large = d === 2 ? 0 : 0;
        body += cell(i,
          `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" class="fillA"/>` +
          `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${Math.max(6, 22 - d)}" class="topping"/>`);
      }
    }
    body += `<circle cx="${cx}" cy="${cy}" r="${r}" class="ring"/>`;
  }

  if (kind === 'cake') {
    vb = '0 0 220 150';
    const x0 = 10, wBox = 200, y0 = 40, hBox = 90, cw = wBox / d;
    for (let i = 0; i < d; i++) {
      const x = x0 + i * cw;
      body += cell(i,
        `<rect x="${x.toFixed(2)}" y="${y0}" width="${cw.toFixed(2)}" height="${hBox}" class="fillA"/>` +
        `<rect x="${x.toFixed(2)}" y="${y0}" width="${cw.toFixed(2)}" height="16" class="icing"/>` +
        `<circle cx="${(x + cw / 2).toFixed(2)}" cy="${y0 - 8}" r="${Math.min(8, cw / 2.6)}" class="cherry"/>`);
    }
    body += `<rect x="${x0}" y="${y0}" width="${wBox}" height="${hBox}" rx="6" class="ring"/>` +
      `<rect x="2" y="${y0 + hBox}" width="216" height="12" rx="6" class="plate"/>`;
  }

  if (kind === 'choc') {
    vb = '0 0 220 160';
    const [rows, cols] = gridFor(d);
    const pad = 8, cw = (220 - pad * 2) / cols, ch = (160 - pad * 2) / rows;
    for (let i = 0; i < d; i++) {
      const rI = Math.floor(i / cols), cI = i % cols;
      const x = pad + cI * cw, y = pad + rI * ch;
      body += cell(i,
        `<rect x="${(x + 2).toFixed(2)}" y="${(y + 2).toFixed(2)}" width="${(cw - 4).toFixed(2)}" height="${(ch - 4).toFixed(2)}" rx="9" class="fillA"/>` +
        `<rect x="${(x + 9).toFixed(2)}" y="${(y + 9).toFixed(2)}" width="${(cw - 18).toFixed(2)}" height="${(ch - 18).toFixed(2)}" rx="6" class="shine"/>`);
    }
  }

  if (kind === 'bar') {
    vb = '0 0 220 56';
    const x0 = 6, wBox = 208, cw = wBox / d;
    for (let i = 0; i < d; i++) {
      const x = x0 + i * cw;
      body += cell(i, `<rect x="${x.toFixed(2)}" y="6" width="${cw.toFixed(2)}" height="44" class="fillA"/>`);
    }
    body += `<rect x="${x0}" y="6" width="${wBox}" height="44" rx="8" class="ring"/>`;
  }

  if (kind === 'fruit') {
    const per = d <= 5 ? d : Math.ceil(d / 2), rowsN = d <= 5 ? 1 : 2;
    const cwd = 220 / per, rad = Math.min(30, cwd / 2 - 4);
    vb = `0 0 220 ${rowsN * (rad * 2 + 16) + 4}`;
    for (let i = 0; i < d; i++) {
      const rI = Math.floor(i / per), cI = i % per;
      const inRow = rI === rowsN - 1 ? d - per * (rowsN - 1) : per;
      const offset = (220 - inRow * cwd) / 2;
      const cx = offset + cI * cwd + cwd / 2, cy = 8 + rad + rI * (rad * 2 + 16);
      body += cell(i,
        `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" class="fillA"/>` +
        `<path d="M${cx.toFixed(1)} ${(cy - rad + 2).toFixed(1)} q${rad * 0.1} ${-rad * 0.45} ${rad * 0.4} ${-rad * 0.5}" class="stem"/>` +
        `<ellipse cx="${(cx + rad * 0.45).toFixed(1)}" cy="${(cy - rad - 1).toFixed(1)}" rx="${rad * 0.3}" ry="${rad * 0.16}" class="leaf"/>` +
        `<circle cx="${(cx - rad * 0.38).toFixed(1)}" cy="${(cy - rad * 0.3).toFixed(1)}" r="${rad * 0.2}" class="shine2"/>`);
    }
  }

  return `<svg class="${cls}" viewBox="${vb}" style="width:${w}px;max-width:100%" role="img" ` +
    `aria-label="${KIND_NAME[kind]} dibagi ${d} bagian, ${flags.filter(Boolean).length} berwarna" data-kind="${kind}" data-d="${d}" data-on="${flags.filter(Boolean).length}">${body}</svg>`;
}

/* n bagian berwarna pertama dari d bagian */
const fracVis = (kind, n, d, opts) => partsVis(kind, d, Array.from({ length: d }, (_, i) => i < n), opts);
const emptyVis = (kind, d, opts) => partsVis(kind, d, Array(d).fill(false), opts);

/* Dua batang bertumpuk untuk perbandingan / pecahan senilai */
function stackBars(items, w = 260) {
  return `<div class="stack-bars">${items.map(it =>
    `<div class="sb-row"><span class="sb-label">${fr(it.n, it.d)}</span>${fracVis('bar', it.n, it.d, { w })}</div>`).join('')}</div>`;
}

/* ============================================================
   Pembuat soal: helper umum
   Tipe: mc (pilihan ganda), fill (isian), match (pasangan),
         order (urutkan), shade (arsir gambar)
   ============================================================ */
const NAMES = ['Dina', 'Budi', 'Sari', 'Raka', 'Ayu', 'Tono', 'Maya', 'Rafi', 'Nia', 'Joko', 'Lala', 'Bima'];
const pickNames = k => sample(NAMES, k);

/* Pilihan ganda. correct & wrong = {html, key}. Kunci unik dijaga. */
function mcQ({ prompt, visual = '', correct, wrong, explain, truth = null, layout = '' }) {
  const seen = new Set([correct.key]);
  const opts = [{ html: correct.html, key: correct.key, ok: true }];
  for (const w of wrong) {
    if (seen.has(w.key)) continue;
    seen.add(w.key);
    opts.push({ html: w.html, key: w.key, ok: false });
  }
  const mixed = shuffle(opts).slice(0, 4);
  if (!mixed.some(o => o.ok)) mixed[0] = opts[0];
  const options = shuffle(mixed);
  return { type: 'mc', prompt, visual, options, answer: options.findIndex(o => o.ok), explain, truth, layout };
}

/* Pilihan ganda khusus pecahan: kandidat pengecoh disaring sehingga NILAI-nya berbeda */
function mcFrac({ prompt, visual, correct, candidates = [], explain, truth = null, show = simp }) {
  const bad = [];
  const add_ = f => {
    if (!f || f.n <= 0 || f.d <= 0) return;
    if (eq(f, correct) || bad.some(b => eq(b, f))) return;
    bad.push(f);
  };
  shuffle(candidates).forEach(add_);
  let guard = 0;
  while (bad.length < 3 && guard++ < 60) {
    const d = Math.max(2, correct.d + rand(-2, 3)), n = rand(1, d);
    add_(F(n, d));
  }
  const wrongOpts = bad.slice(0, 3).map(f => ({ html: frF(f), key: fkey(f) }));
  const cShown = show(correct);
  return mcQ({ prompt, visual, correct: { html: frF(cShown), key: fkey(correct) }, wrong: wrongOpts, explain, truth: truth ?? val(correct) });
}

/* Isian. kind: 'two' (pembilang & penyebut) atau 'int' (bilangan bulat). */
function fillQ({ prompt, visual = '', kind, answer, exact = false, explain, truth = null, unit = '' }) {
  return { type: 'fill', prompt, visual, kind, answer, exact, explain, truth, unit };
}

/* Mencocokkan pasangan: pairs = [{l, r}] (html) */
function matchQ({ prompt, pairs, explain }) {
  return { type: 'match', prompt, visual: '', pairs, explain };
}

/* Mengurutkan dari terkecil ke terbesar: items = [F] */
function orderQ({ prompt, fracs, explain }) {
  const items = fracs.map((f, i) => ({ f, html: fr(f.n, f.d), id: i }));
  const sorted = items.slice().sort((a, b) => cmp(a.f, b.f));
  return { type: 'order', prompt, visual: '', items: shuffle(items), correctOrder: sorted.map(i => i.id), explain };
}

/* Arsir gambar: pemain mengklik bagian untuk mewarnai */
function shadeQ({ prompt, kind, n, d, explain }) {
  return { type: 'shade', prompt, visual: '', kind, n, d, explain };
}

/* Pilih pecahan acak yang nilainya berbeda semua */
function distinctFracs(pool, k) {
  const out = [];
  for (const f of shuffle(pool)) {
    if (out.length >= k) break;
    if (!out.some(o => eq(o, f))) out.push(f);
  }
  return out;
}

/* Semua pecahan sejati dengan penyebut tertentu */
const properFracs = dens => {
  const out = [];
  dens.forEach(d => { for (let n = 1; n < d; n++) out.push(F(n, d)); });
  return out;
};

/* Penjelasan langkah penyamaan penyebut */
function commonDenExplain(a, b, sign) {
  const L = lcm(a.d, b.d);
  const an = a.n * (L / a.d), bn = b.n * (L / b.d);
  const res = sign === '+' ? an + bn : an - bn;
  const r = simp(F(res, L));
  const same = a.d === b.d;
  let s = same
    ? `Penyebutnya sudah sama (${L}), jadi cukup ${sign === '+' ? 'jumlahkan' : 'kurangkan'} pembilangnya: ${fr(a.n, L)} ${op(sign)} ${fr(b.n, L)} = ${fr(res, L)}.`
    : `Samakan penyebut dulu menjadi ${L}: ${fr(a.n, a.d)} = ${fr(an, L)} dan ${fr(b.n, b.d)} = ${fr(bn, L)}. Lalu ${sign === '+' ? 'jumlahkan' : 'kurangkan'} pembilangnya: ${fr(an, L)} ${op(sign)} ${fr(bn, L)} = ${fr(res, L)}.`;
  if (r.n !== res || r.d !== L) s += ` Disederhanakan menjadi ${frF(r)}.`;
  return s;
}

const SYM = { '>': '&gt;', '<': '&lt;', '=': '=' };
const symOf = (a, b) => (cmp(a, b) > 0 ? '>' : cmp(a, b) < 0 ? '<' : '=');
const symOptions = () => ['>', '<', '='].map(s => ({ html: `<span class="symbig">${SYM[s]}</span>`, key: s }));
const MINUS = '−';

function symQ({ prompt, visual, a, b, explain }) {
  const s = symOf(a, b);
  return mcQ({
    prompt, visual,
    correct: symOptions().find(o => o.key === s),
    wrong: symOptions().filter(o => o.key !== s),
    explain, truth: Math.sign(val(a) - val(b)), layout: 'row'
  });
}
const cmpLine = (a, b) => `<div class="cmp-line">${fr(a.n, a.d)}<span class="cmp-q">?</span>${fr(b.n, b.d)}</div>`;

/* ---------------- LEVEL 3 ---------------- */
LEVELS.push({

  topics: 'Lebih besar, lebih kecil, sama dengan, dan mengurutkan',

    { title: 'Penyebut berbeda', text: `Samakan penyebutnya dulu, baru bandingkan pembilangnya.<div class="fr-big">${fr(1, 2)} ${op('?')} ${fr(2, 5)}</div>Penyebut sama jadi 10: ${fr(5, 10)} ${op('&gt;')} ${fr(4, 10)}`, visual: '', cap: '' },
    { title: 'Simbol perbandingan', text: `<span class="symbig">&gt;</span> lebih besar dari &nbsp; <span class="symbig">&lt;</span> lebih kecil dari &nbsp; <span class="symbig">=</span> sama dengan<br>Mulut simbol selalu menghadap ke pecahan yang <b>lebih besar</b>.`, visual: '', cap: '' }
  ],
  make() {

      })); }

    // 2. Pembilang sama
    { const n = rand(1, 3), b = rand(n + 1, 5), c = rand(b + 1, 9);
      const A = F(n, b), C = F(n, c), swap = Math.random() < 0.5;
      const x = swap ? C : A, y = swap ? A : C;
      qs.push(mcFrac({
        prompt: `Manakah pecahan yang <b>lebih besar</b>, ${fr(x.n, x.d)} atau ${fr(y.n, y.d)}?`,
        visual: stackBars([x, y], 240),
        correct: A, show: f => f, candidates: [C],
        explain: `Pembilangnya sama (${n}). Makin besar penyebut, makin kecil tiap potongannya. ${b} < ${c}, jadi ${fr(n, b)} &gt; ${fr(n, c)}.`
      }));
      // hanya dua pilihan: sisakan dua opsi
      const q = qs[qs.length - 1]; q.options = q.options.filter(o => o.key === fkey(A) || o.key === fkey(C));
      q.answer = q.options.findIndex(o => o.ok); q.layout = 'row'; }

    // 3. Penyebut berbeda
    { let A, B;
      if (Math.random() < 0.25) { const b0 = pick([F(1, 2), F(2, 3), F(3, 4), F(1, 3)]), k = pick([2, 3]); A = b0; B = F(b0.n * k, b0.d * k); }
      else { do { const b = pick([2, 3, 4, 5, 6]), d = pick([2, 3, 4, 5, 6]); A = F(rand(1, b - 1), b); B = F(rand(1, d - 1), d); } while (A.d === B.d || eq(A, B)); }
      const L = lcm(A.d, B.d), an = A.n * L / A.d, bn = B.n * L / B.d;

    // 4. Urutkan dari terkecil
    { const pool = properFracs([2, 3, 4, 6, 12]);
      const fracs = distinctFracs(pool, 4);

      qs.push(orderQ({
        prompt: 'Urutkan dari yang <b>terkecil</b> ke <b>terbesar</b>! Ketuk pecahan satu per satu.', fracs,

      })); }

    // 5. Pecahan terkecil
    { const fracs = distinctFracs(properFracs([3, 4, 5, 6, 8]), 4);
      const L = fracs.reduce((l, f) => lcm(l, f.d), 1);
      const small = fracs.slice().sort(cmp)[0];
      qs.push(mcQ({
        prompt: 'Manakah pecahan yang <b>paling kecil</b>?',
        correct: { html: fr(small.n, small.d), key: fkey(small) },
        wrong: fracs.filter(f => !eq(f, small)).map(f => ({ html: fr(f.n, f.d), key: fkey(f) })),
        truth: val(small),
        explain: `Samakan penyebut menjadi ${L}: ${fracs.map(f => `${fr(f.n, f.d)} = ${fr(f.n * L / f.d, L)}`).join(', ')}. Pembilang terkecil adalah ${small.n * L / small.d}, yaitu ${fr(small.n, small.d)}.`
      })); }

    // 6. Soal cerita
    { let A, B;
      do { A = pick(properFracs([2, 3, 4, 5, 6, 8])); B = pick(properFracs([2, 3, 4, 5, 6, 8])); } while (A.d === B.d || eq(A, B));

      const L = lcm(A.d, B.d), win = cmp(A, B) > 0 ? n1 : n2;
      qs.push(mcQ({
        prompt: `${n1} ${verb} ${fr(A.n, A.d)} bagian ${item}, sedangkan ${n2} ${verb} ${fr(B.n, B.d)} bagian ${item} yang sama besar. Siapa yang ${verb} lebih banyak?`,
        correct: { html: win, key: win },
        wrong: [n1, n2, 'Sama banyak'].filter(x => x !== win).map(x => ({ html: x, key: x })),
        truth: Math.sign(val(A) - val(B)),
        explain: `Samakan penyebut menjadi ${L}: ${fr(A.n, A.d)} = ${fr(A.n * L / A.d, L)} dan ${fr(B.n, B.d)} = ${fr(B.n * L / B.d, L)}. ${A.n * L / A.d} ${SYM[symOf(A, B)]} ${B.n * L / B.d}, jadi ${win} ${verb} lebih banyak.`
      })); }
    return qs;
  }
});

LEVELS.push({

    { title: 'Langkah mudah', text: '<ol class="tips"><li>Cari penyebut yang sama (kelipatan persekutuan).</li><li>Ubah kedua pecahan.</li><li>Tambah / kurangkan pembilang.</li><li>Sederhanakan jika bisa.</li></ol>', visual: '', cap: '' }
  ],
  make() {

    { const d = rand(5, 12), a = rand(1, d - 3), b = rand(1, d - 1 - a);
      const A = F(a, d), B = F(b, d), R = add(A, B);
      qs.push(fillFrac(`Hitunglah: ${fr(a, d)} ${op('+')} ${fr(b, d)} ${op('=')} ?`, exprRow(A, B, '+'), R, commonDenExplain(A, B, '+'))); }

    // 2. Pengurangan penyebut sama
    { const d = rand(5, 12), a = rand(3, d - 1), b = rand(1, a - 1);

      qs.push(fillFrac(`Hitunglah: ${fr(a, d)} ${op(MINUS)} ${fr(b, d)} ${op('=')} ?`, exprRow(A, B, MINUS), R, commonDenExplain(A, B, '-'))); }

    { const [A, B] = pick([[F(1, 2), F(1, 4)], [F(1, 3), F(1, 6)], [F(2, 3), F(1, 6)], [F(1, 2), F(1, 6)], [F(3, 4), F(1, 8)], [F(1, 4), F(3, 8)], [F(1, 2), F(1, 8)], [F(2, 5), F(1, 10)]]);
      const R = add(A, B);
      qs.push(fillFrac(`Hitunglah: ${fr(A.n, A.d)} ${op('+')} ${fr(B.n, B.d)} ${op('=')} ?`, '', R, commonDenExplain(A, B, '+'))); }

    // 4. Pengurangan penyebut berbeda (kelipatan)
    { const [A, B] = pick([[F(3, 4), F(1, 2)], [F(5, 6), F(1, 3)], [F(7, 8), F(1, 4)], [F(2, 3), F(1, 6)], [F(3, 4), F(1, 8)], [F(4, 5), F(1, 10)], [F(1, 2), F(1, 6)]]);
      const R = sub(A, B);
      qs.push(fillFrac(`Hitunglah: ${fr(A.n, A.d)} ${op(MINUS)} ${fr(B.n, B.d)} ${op('=')} ?`, '', R, commonDenExplain(A, B, '-'))); }

    // 5. Penyebut berbeda tanpa kelipatan (pilihan ganda)
    { const [A, B] = pick([[F(1, 2), F(1, 3)], [F(1, 3), F(1, 4)], [F(1, 2), F(1, 5)], [F(1, 4), F(1, 5)], [F(2, 3), F(1, 4)], [F(3, 4), F(1, 5)]]);
      const plus = Math.random() < 0.5, R = plus ? add(A, B) : sub(A, B);
      const naive = plus ? F(A.n + B.n, A.d + B.d) : F(A.n - B.n || 1, A.d - B.d || 1);
      qs.push(mcFrac({
        prompt: `${fr(A.n, A.d)} ${op(plus ? '+' : MINUS)} ${fr(B.n, B.d)} ${op('=')} ...`,

        candidates: [naive, F(R.n + 1, R.d), F(R.n, R.d + 1), F(Math.max(1, R.n - 1), R.d)],
        explain: commonDenExplain(A, B, plus ? '+' : '-') + ' Ingat: penyebut tidak boleh langsung dijumlahkan.'

    // 6. Soal cerita
    { const stories = [
        { s: '+', A: F(1, 2), B: F(1, 4), t: (a, b) => `Ibu membeli ${a} kg gula pasir dan ${b} kg gula merah. Berapa kg gula yang dibeli Ibu seluruhnya?` },
        { s: '+', A: F(1, 3), B: F(1, 6), t: (a, b) => `Budi minum ${a} liter susu saat pagi dan ${b} liter saat sore. Berapa liter susu yang diminum Budi?` },
        { s: '-', A: F(5, 6), B: F(1, 3), t: (a, b) => `Rina punya pita sepanjang ${a} meter. Pita dipakai ${b} meter untuk hiasan. Berapa meter pita yang tersisa?` },
        { s: '-', A: F(3, 4), B: F(1, 8), t: (a, b) => `Dalam botol ada ${a} liter sirup. Dituang ${b} liter ke gelas. Berapa liter sirup yang tersisa?` },

      ];
      const st = pick(stories), plus = st.s === '+', R = plus ? add(st.A, st.B) : sub(st.A, st.B);
      qs.push(mcFrac({
        prompt: st.t(fr(st.A.n, st.A.d), fr(st.B.n, st.B.d)),

        candidates: [F(st.A.n + st.B.n, st.A.d + st.B.d), F(R.n + 1, R.d), F(R.n, R.d + 1), F(Math.max(1, R.n - 1), R.d)],
        explain: commonDenExplain(st.A, st.B, plus ? '+' : '-')

    // 7. Operasi campuran tiga pecahan
    { const [A, B, C] = pick([[F(3, 4), F(1, 2), F(1, 8)], [F(5, 6), F(1, 3), F(1, 6)], [F(1, 2), F(1, 4), F(1, 8)], [F(2, 3), F(1, 3), F(1, 6)]]);

        `Kerjakan dari kiri. Langkah 1: ${fr(A.n, A.d)} ${op(MINUS)} ${fr(B.n, B.d)} = ${frF(m)}. Langkah 2: ${frF(m)} ${op('+')} ${fr(C.n, C.d)} = ${frF(R)}.`)); }
    return qs;
  }
});
/* ============================================================

const TIMES = '×', DIVS = '÷';
const mulExplain = (A, B) => {
  const r = F(A.n * B.n, A.d * B.d), s = simp(r);
  return `Kalikan pembilang dengan pembilang dan penyebut dengan penyebut: ${fr(A.n, A.d)} ${op(TIMES)} ${fr(B.n, B.d)} = ${fr(A.n + ' × ' + B.n, A.d + ' × ' + B.d)} = ${fr(r.n, r.d)}${s.n !== r.n ? ', disederhanakan menjadi ' + frF(s) : ''}.`;
};
const divExplain = (A, B) => {
  const r = F(A.n * B.d, A.d * B.n), s = simp(r);
  return `Bagi pecahan = kalikan dengan <b>kebalikan</b>: ${fr(A.n, A.d)} ${op(DIVS)} ${fr(B.n, B.d)} = ${fr(A.n, A.d)} ${op(TIMES)} ${fr(B.d, B.n)} = ${fr(r.n, r.d)}${s.n !== r.n || s.d !== r.d ? ' = ' + frF(s) : ''}.`;
};

LEVELS.push({
  id: 5, title: 'Kali & Bagi Pecahan', region: 'Gunung Kali-Bagi', color: 'lilac', icon: 'times',
  topics: 'Perkalian dan pembagian pecahan',
  lesson: () => [
    { title: 'Pecahan × bilangan bulat', text: `Kalikan <b>pembilangnya</b> saja.<div class="fr-big">${op('3')} ${op(TIMES)} ${fr(1, 4)} ${op('=')} ${fr('3 × 1', 4)} ${op('=')} ${fr(3, 4)}</div>`, visual: fracVis('pizza', 3, 4, { w: 150 }), cap: `3 potong dari 4 = ${fr(3, 4)}` },
    { title: 'Pecahan × pecahan', text: `Pembilang × pembilang, penyebut × penyebut.<div class="fr-big">${fr(2, 3)} ${op(TIMES)} ${fr(3, 4)} ${op('=')} ${fr(6, 12)} ${op('=')} ${fr(1, 2)}</div>`, visual: '', cap: '' },

  ],
  make() {
    const qs = [];

    // 1. Pecahan × bilangan bulat
    { let a, b, n;
      do { b = pick([4, 5, 6, 8, 9, 10]); a = rand(1, 2); n = rand(2, 5); } while (a * n >= b);
      const R = simp(F(a * n, b));
      qs.push(fillQ({
        prompt: `Hitunglah: ${n} ${op(TIMES)} ${fr(a, b)} ${op('=')} ?`,
        visual: '', kind: 'two', answer: R, exact: false, truth: n * a / b,
        explain: `${n} × ${fr(a, b)} = ${fr(n + ' × ' + a, b)} = ${fr(a * n, b)}${R.n !== a * n ? ', disederhanakan menjadi ' + frF(R) : ''}.`
      })); }

    // 2. Pecahan × pecahan
    { let A, B;
      do { A = F(rand(1, 3), rand(2, 6)); B = F(rand(1, 3), rand(2, 6)); } while (A.n >= A.d || B.n >= B.d);
      const R = mul(A, B);
      qs.push(fillQ({
        prompt: `Hitunglah: ${fr(A.n, A.d)} ${op(TIMES)} ${fr(B.n, B.d)} ${op('=')} ?`,
        visual: '', kind: 'two', answer: R, exact: false, truth: (A.n / A.d) * (B.n / B.d), explain: mulExplain(A, B)
      })); }

    // 3. Pecahan ÷ bilangan bulat
    { const [A, n] = pick([[F(1, 2), 3], [F(3, 4), 3], [F(2, 3), 2], [F(1, 3), 2], [F(3, 5), 3], [F(4, 5), 2], [F(1, 4), 2], [F(3, 4), 2]]);
      const R = div(A, F(n, 1));
      qs.push(fillQ({
        prompt: `Hitunglah: ${fr(A.n, A.d)} ${op(DIVS)} ${n} ${op('=')} ?`,
        visual: '', kind: 'two', answer: R, exact: false, truth: (A.n / A.d) / n,
        explain: `Bagi dengan ${n} sama dengan kali ${fr(1, n)}: ${fr(A.n, A.d)} ${op(TIMES)} ${fr(1, n)} = ${fr(A.n, A.d * n)}${simp(F(A.n, A.d * n)).d !== A.d * n ? ' = ' + frF(R) : ''}.`
      })); }

    // 4. Pecahan ÷ pecahan (pilihan ganda)
    { const [A, B] = pick([[F(1, 2), F(1, 4)], [F(3, 4), F(1, 8)], [F(1, 2), F(3, 4)], [F(2, 3), F(1, 3)], [F(3, 5), F(3, 10)], [F(1, 3), F(1, 6)], [F(2, 3), F(4, 9)], [F(3, 4), F(1, 2)]]);
      const R = div(A, B);
      qs.push(mcFrac({
        prompt: `${fr(A.n, A.d)} ${op(DIVS)} ${fr(B.n, B.d)} ${op('=')} ...`,
        correct: R,
        candidates: [mul(A, B), div(B, A), F(A.n * B.d, A.d * B.d * 2), add(A, B), F(R.n + 1, R.d)],

      })); }

    // 5. Pecahan dari suatu jumlah
    { const b = pick([3, 4, 5, 6, 8]), a = rand(1, b - 1), k = rand(2, 5), total = b * k;
      const things = pick([['permen', 'butir'], ['jeruk', 'buah'], ['kelereng', 'butir'], ['buku', 'buah'], ['stiker', 'lembar']]);
      qs.push(fillQ({
        prompt: `Ada <b>${total}</b> ${things[0]}. Sebanyak ${fr(a, b)} dari ${things[0]} itu diberikan kepada adik. Berapa ${things[1]} ${things[0]} yang diberikan?`,
        visual: '', kind: 'int', answer: a * k, truth: (a / b) * total, unit: things[1] + ' ' + things[0],
        explain: `${fr(a, b)} dari ${total} = ${fr(a, b)} ${op(TIMES)} ${total}. Cara mudah: ${total} ÷ ${b} = ${k}, lalu ${k} × ${a} = <b>${a * k}</b>.`
      })); }

    // 6. Bagi pecahan dengan gambar
    { const [A, n] = pick([[F(1, 2), 2], [F(1, 2), 3], [F(1, 3), 2], [F(3, 4), 3], [F(2, 3), 2], [F(3, 4), 2]]);
      const R = div(A, F(n, 1)), nm = pickNames(1)[0];
      qs.push(mcFrac({
        prompt: `Sisa pizza ${fr(A.n, A.d)} bagian dibagi <b>sama rata</b> untuk ${n} anak. Tiap anak mendapat ... bagian pizza.`,

        correct: R, show: f => f,
        candidates: [mul(A, F(n, 1)).d === 1 ? null : mul(A, F(n, 1)), F(A.n, A.d + n), F(A.n + n, A.d), F(1, n), F(R.n + 1, R.d)].filter(Boolean),
        explain: `${fr(A.n, A.d)} ${op(DIVS)} ${n} = ${fr(A.n, A.d)} ${op(TIMES)} ${fr(1, n)} = ${frF(R)}. Tiap anak mendapat ${frF(R)} bagian.`, truth: val(A) / n
      })); }
    return qs;
  }
});

    { title: 'Kata kunci', text: `<ul class="tips"><li><b>Total, seluruhnya, gabungan</b> → tambah (+)</li><li><b>Sisa, tinggal</b> → kurang (−)</li><li><b>Dari, kali, tiap</b> → kali (×)</li><li><b>Dibagi, sama rata</b> → bagi (÷)</li></ul>`, visual: '', cap: '' },
    { title: 'Misi terakhir!', text: 'Sekarang gabungkan semua ilmumu. Kerjakan langkah demi langkah. Kamu pasti bisa menjadi <b>Pahlawan Negeri Pecahan</b>!', visual: mascot('cheer', 130), cap: '' }
  ],
  make() {
    const qs = [];

    // 1. Cerita: pengurangan
    { const [A, B] = pick([[F(3, 4), F(1, 3)], [F(5, 6), F(1, 2)], [F(7, 8), F(1, 4)], [F(2, 3), F(1, 4)]]);
      const R = sub(A, B);
      qs.push(mcFrac({
        prompt: `Ibu punya ${fr(A.n, A.d)} kg tepung. Untuk membuat kue dipakai ${fr(B.n, B.d)} kg. Berapa kg tepung yang tersisa?`,
        correct: R, show: f => f,
        candidates: [F(A.n - B.n || 1, A.d - B.d || 1), add(A, B), F(R.n + 1, R.d), F(R.n, R.d + 1)],
        explain: commonDenExplain(A, B, '-'), truth: val(A) - val(B)
      })); }

    // 2. Cerita: pecahan dari jumlah
    { const b = pick([3, 4, 5, 6, 8]), a = rand(1, b - 1), k = rand(2, 6), total = b * k, nm = pickNames(1)[0];
      qs.push(fillQ({
        prompt: `${nm} punya <b>${total}</b> kelereng. ${fr(a, b)} dari kelereng itu berwarna biru. Ada berapa kelereng biru?`,
        visual: '', kind: 'int', answer: a * k, truth: (a / b) * total, unit: 'kelereng biru',
        explain: `${fr(a, b)} dari ${total}: ${total} ÷ ${b} = ${k}, lalu ${k} × ${a} = <b>${a * k}</b> kelereng biru.`
      })); }

    // 3. Cerita: penjumlahan waktu
    { const [A, B] = pick([[F(1, 3), F(1, 4)], [F(1, 2), F(1, 5)], [F(1, 4), F(1, 6)], [F(1, 3), F(1, 5)]]);
      const R = add(A, B);
      qs.push(fillQ({
        prompt: `Rani belajar Matematika selama ${fr(A.n, A.d)} jam dan belajar IPA selama ${fr(B.n, B.d)} jam. Berapa jam waktu belajar Rani seluruhnya?`,
        visual: '', kind: 'two', answer: R, exact: false, truth: val(A) + val(B), explain: commonDenExplain(A, B, '+')
      })); }

    // 4. Logika: cari bilangan yang hilang
    { const [x, y, z] = pick([[F(1, 2), F(1, 4), F(3, 4)], [F(1, 3), F(1, 6), F(1, 2)], [F(1, 4), F(1, 2), F(3, 4)], [F(2, 5), F(1, 5), F(3, 5)], [F(1, 6), F(1, 3), F(1, 2)]]);
      qs.push(fillQ({
        prompt: `<b>Teka-teki:</b> Aku sebuah pecahan. Jika aku ditambah ${fr(y.n, y.d)}, hasilnya ${fr(z.n, z.d)}. Siapakah aku?`,
        visual: '', kind: 'two', answer: x, exact: false, truth: val(z) - val(y),
        explain: `Gunakan operasi kebalikan: ${fr(z.n, z.d)} ${op(MINUS)} ${fr(y.n, y.d)} = ${frF(x)}. Cek: ${frF(x)} ${op('+')} ${fr(y.n, y.d)} = ${fr(z.n, z.d)}.`
      })); }

    // 5. Dua langkah: sisa kelereng
    { const sets = [[20, F(1, 4), F(2, 5)], [24, F(1, 3), F(3, 8)], [30, F(1, 2), F(1, 3)], [12, F(1, 2), F(1, 3)], [40, F(1, 4), F(1, 5)]];
      const [T, A, B] = pick(sets), a = val(A) * T, b = val(B) * T, left = T - a - b;
      qs.push(fillQ({
        prompt: `Dalam kotak ada <b>${T}</b> kelereng. ${fr(A.n, A.d)} berwarna merah, ${fr(B.n, B.d)} berwarna biru, sisanya hijau. Berapa kelereng hijau?`,
        visual: '', kind: 'int', answer: left, truth: T - T * val(A) - T * val(B), unit: 'kelereng hijau',
        explain: `Merah: ${fr(A.n, A.d)} × ${T} = ${a}. Biru: ${fr(B.n, B.d)} × ${T} = ${b}. Hijau: ${T} − ${a} − ${b} = <b>${left}</b>.`
      })); }

    // 6. Cocokkan operasi dan hasil
    { const pool = [
        { l: `${fr(1, 2)} ${op('+')} ${fr(1, 3)}`, f: add(F(1, 2), F(1, 3)) },
        { l: `${fr(2, 3)} ${op(MINUS)} ${fr(1, 6)}`, f: sub(F(2, 3), F(1, 6)) },
        { l: `3 ${op(TIMES)} ${fr(1, 4)}`, f: mul(F(3, 1), F(1, 4)) },
        { l: `${fr(1, 2)} ${op(DIVS)} ${fr(1, 4)}`, f: div(F(1, 2), F(1, 4)) },
        { l: `${fr(3, 4)} ${op(MINUS)} ${fr(1, 2)}`, f: sub(F(3, 4), F(1, 2)) },
        { l: `${fr(1, 3)} ${op(TIMES)} ${fr(3, 5)}`, f: mul(F(1, 3), F(3, 5)) },
        { l: `${fr(1, 2)} ${op(DIVS)} 3`, f: div(F(1, 2), F(3, 1)) }
      ];
      const chosen = [];
      shuffle(pool).forEach(p => { if (chosen.length < 3 && !chosen.some(c => eq(c.f, p.f))) chosen.push(p); });
      qs.push(matchQ({
        prompt: 'Hitung dalam hati, lalu cocokkan setiap soal dengan hasilnya!',
        pairs: chosen.map(c => ({ l: c.l, r: frF(c.f) })),
        explain: 'Tambah/kurang: samakan penyebut. Kali: pembilang × pembilang, penyebut × penyebut. Bagi: kali kebalikan.'
      })); }

    // 7. Cerita pembagian
    { if (Math.random() < 0.5) {
        const [A, B] = pick([[F(1, 2), F(1, 8)], [F(3, 4), F(1, 4)], [F(2, 3), F(1, 6)], [F(3, 4), F(3, 8)]]);
        const R = div(A, B);
        qs.push(fillQ({
          prompt: `Ada ${fr(A.n, A.d)} loyang kue. Setiap porsi adalah ${fr(B.n, B.d)} loyang. Berapa porsi yang bisa dibuat?`,
          visual: '', kind: 'int', answer: R.n, truth: val(A) / val(B), unit: 'porsi',
          explain: `Banyak porsi = ${fr(A.n, A.d)} ${op(DIVS)} ${fr(B.n, B.d)} = ${fr(A.n, A.d)} ${op(TIMES)} ${fr(B.d, B.n)} = <b>${R.n}</b> porsi.`
        }));
      } else {
        const [A, n] = pick([[F(3, 4), 3], [F(2, 3), 2], [F(3, 5), 3], [F(1, 2), 2]]);
        const R = div(A, F(n, 1));
        qs.push(mcFrac({
          prompt: `Pita sepanjang ${fr(A.n, A.d)} meter dipotong menjadi ${n} bagian sama panjang. Berapa meter panjang tiap potongan?`,
          correct: R, show: f => f,
          candidates: [mul(A, F(n, 1)), F(A.n, A.d + n), F(A.n + n, A.d), F(R.n + 1, R.d)].filter(f => !isWhole(f)),
          explain: `${fr(A.n, A.d)} ${op(DIVS)} ${n} = ${fr(A.n, A.d)} ${op(TIMES)} ${fr(1, n)} = ${frF(R)} meter.`, truth: val(A) / n
        }));
      } }
    return qs;
  }
});

};

/* ---------- Materi sebelum level ---------- */

SCREENS.lesson = ({ level, i = 0 }) => { lessonState.level = level; lessonState.i = i; return lessonHtml(LEVELS[level - 1], i, false); };
function lessonStep(delta) {
  const L = LEVELS[lessonState.level - 1], max = L.lesson().length - 1;
  lessonState.i = Math.max(0, Math.min(max, lessonState.i + delta));
  const inModal = !!$('#overlay-root .sheet.lesson-modal');
  if (inModal) $('#overlay-root .lesson-modal').innerHTML = lessonHtml(L, lessonState.i, true);
  else go('lesson', { level: lessonState.level, i: lessonState.i });

}
